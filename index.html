<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação — Aniversário da Natally 💙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1E88E5 0%, #64B5F6 50%, #E1F5FE 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: #fff;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .stitch-decoration {
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 12px;
            background: repeating-linear-gradient(
                90deg,
                #4A148C 0px,
                #4A148C 15px,
                transparent 15px,
                transparent 25px
            );
        }

        .stitch-decoration-bottom {
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 12px;
            background: repeating-linear-gradient(
                90deg,
                #4A148C 0px,
                #4A148C 15px,
                transparent 15px,
                transparent 25px
            );
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .stitch-img {
            width: 180px;
            margin-bottom: 15px;
            border-radius: 50%;
            border: 5px solid #6A1B9A;
            box-shadow: 0 0 0 5px #E91E63;
        }

        h1 {
            color: #4A148C;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #1976D2;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .date-info {
            background: #E3F2FD;
            border-radius: 15px;
            padding: 12px;
            margin: 15px 0;
            text-align: center;
            color: #283593;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #4A148C;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #9575CD;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #E91E63;
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.2);
        }

        .btn-confirm {
            width: 100%;
            background: linear-gradient(90deg, #E91E63, #9C27B0);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s ease;
        }

        .btn-confirm:hover {
            transform: scale(1.03);
        }

        .btn-confirm:active {
            transform: scale(0.98);
        }

        .message-box {
            margin-top: 20px;
            padding: 15px;
            background: #F3E5F5;
            border-radius: 12px;
            display: none;
        }

        .message-box.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            margin-top: 10px;
            font-weight: bold;
        }

        .btn-whatsapp:hover {
            background: #128C7E;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: white;
            font-size: 0.9rem;
        }

        .heart {
            color: #E91E63;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="stitch-decoration"></div>

            <div class="header">
                <img 
                    src="https://i.imgur.com/9QfKbQH.png" 
                    alt="Stitch" 
                    class="stitch-img"
                    onerror="this.src='https://via.placeholder.com/180?text=Stitch+💙'"
                >
                <h1>🎉 Aniversário da Natally 🎉</h1>
                <p class="subtitle">10 Anos — Vamos celebrar! 💙</p>
            </div>

            <div class="date-info">
                ✨ Sua presença é o nosso maior presente! ✨<br>
                Preencha abaixo e confirme pelo WhatsApp:
            </div>

            <form id="confirmForm">
                <div class="form-group">
                    <label for="nome">👤 Nome do participante:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="codigo">🎫 Código do convite:</label>
                    <input type="text" id="codigo" placeholder="Ex: NAT123" required>
                </div>

                <div class="form-group">
                    <label for="acompanhantes">👨‍👩‍👧 Quantidade de acompanhantes:</label>
                    <select id="acompanhantes" required>
                        <option value="">Selecione...</option>
                        <option value="0">Apenas eu</option>
                        <option value="1">1 acompanhante</option>
                        <option value="2">2 acompanhantes</option>
                        <option value="3">3 acompanhantes</option>
                        <option value="4">4 acompanhantes</option>
                        <option value="5">5 ou mais</option>
                    </select>
                </div>

                <button type="submit" class="btn-confirm">
                    💙 Gerar mensagem de confirmação 💙
                </button>
            </form>

            <div class="message-box" id="messageBox">
                <p style="color:#4A148C; font-weight:bold; margin-bottom:8px;">Mensagem pronta:</p>
                <p id="mensagemTexto" style="color:#333; font-size:0.95rem; margin-bottom:12px;"></p>
                <a href="" id="linkWpp" class="btn-whatsapp" target="_blank">
                    💬 Enviar pelo WhatsApp
                </a>
            </div>

            <div class="stitch-decoration-bottom"></div>
        </div>

        <div class="footer">
            Feito com <span class="heart">❤</span> para a Natally — 10 anos de muita alegria! 💫<br>
            Em caso de dúvidas, fale conosco: (38) 99841-6655
        </div>
    </div>

    <script>
        const form = document.getElementById('confirmForm');
        const messageBox = document.getElementById('messageBox');
        const mensagemTexto = document.getElementById('mensagemTexto');
        const linkWpp = document.getElementById('linkWpp');
        const numero = '5538998416655'; // Código Brasil + DDD + número

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const codigo = document.getElementById('codigo').value.trim();
            const acompanhantes = document.getElementById('acompanhantes').value;

            if (!nome || !codigo || !acompanhantes) {
                alert('Por favor, preencha todos os campos!');
                return;
            }

            // Monta a mensagem personalizada
            const mensagem = `Olá! 💙 Confirmação de presença — Aniversário da Natally (10 anos) 🎂

👤 Nome: ${nome}
🎫 Código do convite: ${codigo}
👥 Quantidade de acompanhantes: ${acompanhantes}

Confirmo minha presença! Mal posso esperar para celebrar com a Natally! 🎉✨`;

            mensagemTexto.innerText = mensagem;
            
            // Codifica para URL
            const urlBase = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
            linkWpp.href = urlBase;

            // Mostra a caixa com efeito
            messageBox.classList.remove('show');
            setTimeout(() => messageBox.classList.add('show'), 100);
        });
    </script>
</body>
</html>
